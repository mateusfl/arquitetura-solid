<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CRUD de vendas{% endblock %}</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; color: #1f2937; background: #f3f4f6; }
        body { margin: 0; }
        header { background: #17324d; color: white; padding: 1rem max(1rem, calc((100% - 960px) / 2)); }
        header a { color: white; text-decoration: none; font-weight: 700; }
        main { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; border: 1px solid #d1d5db; border-radius: 10px; padding: 1.25rem; margin-bottom: 1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1rem; }
        .button, button { display: inline-block; border: 0; border-radius: 6px; padding: .65rem .9rem; background: #176b57; color: white; text-decoration: none; font: inherit; cursor: pointer; }
        .button.secondary { background: #475569; }
        .button.danger, button.danger { background: #b42318; }
        .actions { display: flex; gap: .5rem; flex-wrap: wrap; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: .7rem; border-bottom: 1px solid #e5e7eb; text-align: left; }
        th { background: #eaf0f5; }
        .table-wrap { overflow-x: auto; }
        label { display: block; font-weight: 600; margin: 1rem 0 .3rem; }
        input, select { box-sizing: border-box; width: 100%; max-width: 520px; padding: .65rem; border: 1px solid #9ca3af; border-radius: 5px; font: inherit; }
        .helptext { color: #52606d; font-size: .9rem; }
        .errorlist, .error { color: #b42318; }
        .messages { padding: 0; list-style: none; }
        .messages li { background: #e5f5ed; border-left: 4px solid #176b57; padding: .75rem; margin-bottom: .5rem; }
        .messages li.error { background: #fff0ee; border-color: #b42318; }
        .muted { color: #52606d; }
    </style>
</head>
<body>
    <header><a href="{% url 'core:inicio' %}">CRUD de vendas e estoque</a></header>
    <main>
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}
            </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
